spring:
  application:
    name: clinics-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinics}
    username: ${DB_USER:clinics}
    password: ${DB_PASSWORD:clinics}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
