spring:
  application:
    name: clinics-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinics}
    username: ${DB_USER:clinics}
    password: ${DB_PASSWORD:clinics}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
  jmx:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  web:
    resources:
      cache:
        # Sempre revalida (ETag): o app web tem service worker e não pode ficar preso numa versão velha.
        cachecontrol:
          no-cache: true
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  jackson:
    default-property-inclusion: non_null
    property-naming-strategy: SNAKE_CASE

server:
  port: ${PORT:8080}
  # Atrás do Cloudflare Tunnel: respeita X-Forwarded-Proto/Host, para o Swagger usar https e o domínio certo.
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${TOMCAT_MAX_THREADS:100}
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,application/problem+json
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      # Em produção defina JWT_SECRET (>= 32 bytes). O valor padrão serve só para desenvolvimento local.
      secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
      expiration: 1h
  storage:
    avatars-dir: ${AVATARS_DIR:./data/avatars}
