services:
  postgres:
    image: postgres:17-alpine
    container_name: clinics_postgres
    environment:
      POSTGRES_DB: clinics
      POSTGRES_USER: clinics
      POSTGRES_PASSWORD: clinics
    ports:
      - "5433:5432"
    volumes:
      - clinics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinics -d clinics"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clinics_pgdata:
