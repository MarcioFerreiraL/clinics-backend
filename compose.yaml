# Desenvolvimento local: `docker compose up -d --build` sobe o banco e a API juntos.
# Lê as variáveis do arquivo .env (copie de .env.example).
# Só o banco (para rodar a API pelo Maven): `docker compose up -d postgres`.
# Produção usa o compose.prod.yaml.
services:
  postgres:
    image: postgres:17-alpine
    container_name: clinics_postgres
    environment:
      POSTGRES_DB: clinics
      POSTGRES_USER: clinics
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinics}
    ports:
      - "5433:5432"
    volumes:
      - clinics_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinics -d clinics"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: clinics_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/clinics
      DB_USER: clinics
      DB_PASSWORD: ${DB_PASSWORD:-clinics}
      # Lido do .env (veja .env.example); o padrão serve só para desenvolvimento local.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-in-production-0123456789}
      AVATARS_DIR: /app/data/avatars
    ports:
      - "8080:8080"
    volumes:
      - clinics_avatars:/app/data/avatars
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  clinics_pgdata:
  clinics_avatars:
